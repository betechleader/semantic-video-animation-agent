<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Semantic Video Animation</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", sans-serif; background: #10131c; color: #f5f7ff; }
    main { max-width: 1000px; margin: 5vh auto; padding: 28px; background: #1d2331; border-radius: 16px; }
    button, input, textarea, select { font: inherit; } button { margin: 8px 8px 8px 0; padding: 10px 16px; cursor: pointer; background: #ffd400; border: 0; border-radius: 8px; color: #111; font-weight: 700; } button:disabled { opacity: .5; cursor: default; }
    .upload-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; } .upload-options label { display: grid; gap: 6px; color: #cbd5e1; } .upload-options select { border-radius: 8px; border: 1px solid #475569; padding: 10px; color: #e2e8f0; background: #0f172a; }
    #status { white-space: pre-wrap; color: #cbd5e1; min-height: 1.5em; } a { color: #ffd400; } .review { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; } textarea { width: 100%; min-height: 320px; box-sizing: border-box; background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 12px; font: 13px ui-monospace, monospace; } video { width: 100%; margin-top: 12px; border-radius: 10px; background: #000; } .hidden { display: none; } .media-review { margin-top: 24px; padding: 18px; background: #121a2a; border: 1px solid #334155; border-radius: 12px; } .media-controls { display: grid; grid-template-columns: 1fr auto auto 1fr; gap: 8px; } .media-controls input, .media-controls select { min-width: 0; border-radius: 8px; border: 1px solid #475569; padding: 10px; color: #e2e8f0; background: #0f172a; } .media-list, .candidate-list { display: grid; gap: 10px; margin-top: 14px; } .media-card { padding: 12px; border-radius: 9px; background: #0f172a; border-left: 4px solid #ffd400; } .media-card small { display: block; color: #94a3b8; margin-top: 4px; overflow-wrap: anywhere; } .media-card button { padding: 6px 10px; margin: 10px 6px 0 0; } .review-note { color: #fbbf24; } @media (max-width: 700px) { .review { grid-template-columns: 1fr; } .media-controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Chinese Semantic Video Animation</h1>
    <p>上传原片后生成知识口播成片。默认使用真实语音转写和语义规划；Mock 仅用于快速工程测试。</p>
    <form id="upload-form">
      <input id="video-file" type="file" accept="video/mp4,.mp4" required />
      <div class="upload-options">
        <label>处理模式
          <select id="processing-profile">
            <option value="real" selected>真实转写 + 语义规划（推荐）</option>
            <option value="mock">Mock 测试文案</option>
            <option value="configured">使用服务端环境变量</option>
          </select>
        </label>
        <label>外部素材
          <select id="upload-media-provider">
            <option value="wikimedia_commons" selected>Wikimedia Commons（无需 Key）</option>
            <option value="pexels">Pexels（需要 PEXELS_API_KEY）</option>
            <option value="mock">本地原创信息图</option>
            <option value="manual">仅人工候选 URL</option>
          </select>
        </label>
      </div>
      <button type="submit">上传并生成成片</button>
    </form>
    <p id="status">Choose an MP4 file to begin.</p>
    <section id="result" class="hidden">
      <video id="preview" controls></video>
      <p><a id="download">Download result video</a></p>
      <div class="review">
        <label>Transcript JSON<textarea id="transcript"></textarea></label>
        <label>Animation plan JSON<textarea id="plan"></textarea></label>
      </div>
      <section class="media-review">
        <h2>External B-roll review</h2>
        <p class="review-note">External material is an effect-validation prototype only. Review source, rights, accuracy, and suitability before commercial publication.</p>
        <div id="media-list" class="media-list"></div>
        <div class="media-controls">
          <input id="media-query" placeholder="Search B-roll, e.g. supermarket product" />
          <select id="media-kind"><option value="external_image">Image</option><option value="external_video">Video</option></select>
          <button id="search-media" type="button">Search</button>
          <input id="manual-media-url" placeholder="Or add an image/video URL" />
        </div>
        <div id="candidate-list" class="candidate-list"></div>
      </section>
      <button id="save-review" type="button">Save review edits and re-render</button>
    </section>
  </main>
  <script>
    const form = document.querySelector('#upload-form');
    const input = document.querySelector('#video-file');
    const processingProfile = document.querySelector('#processing-profile');
    const uploadMediaProvider = document.querySelector('#upload-media-provider');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    const preview = document.querySelector('#preview');
    const download = document.querySelector('#download');
    const transcript = document.querySelector('#transcript');
    const plan = document.querySelector('#plan');
    const saveReview = document.querySelector('#save-review');
    const mediaList = document.querySelector('#media-list');
    const mediaQuery = document.querySelector('#media-query');
    const mediaKind = document.querySelector('#media-kind');
    const searchMedia = document.querySelector('#search-media');
    const manualMediaUrl = document.querySelector('#manual-media-url');
    const candidateList = document.querySelector('#candidate-list');
    let taskId = null;
    let lastEventId = 0;

    const pretty = (value) => JSON.stringify(value, null, 2);
    const setStatus = (message) => { status.textContent = message; };
    const currentPlan = () => JSON.parse(plan.value);
    function writePlan(value) { plan.value = pretty(value); }
    function useCandidate(candidate) {
      const editable = currentPlan();
      const animation = editable.animations.find(item => item.type === 'media_visual' && item.parameters.asset_id === candidate.targetAssetId);
      if (!animation) { setStatus('Choose a target visual before replacing its B-roll.'); return; }
      animation.parameters.selected_candidate_id = candidate.id;
      animation.parameters.enabled = true;
      editable.media_assets = (editable.media_assets || []).filter(asset => asset.asset_id !== animation.parameters.asset_id);
      editable.media_placements = (editable.media_placements || []).filter(item => item.animation_id !== animation.id);
      writePlan(editable); renderMediaReview(editable, []);
      setStatus(`Selected ${candidate.title}. Save review edits to download and render the task-local copy.`);
    }
    function disableMedia(assetId) {
      const editable = currentPlan();
      const animation = editable.animations.find(item => item.type === 'media_visual' && item.parameters.asset_id === assetId);
      if (!animation) return;
      animation.parameters.enabled = false;
      editable.media_assets = (editable.media_assets || []).filter(asset => asset.asset_id !== assetId);
      editable.media_placements = (editable.media_placements || []).filter(item => item.animation_id !== animation.id);
      writePlan(editable); renderMediaReview(editable, []);
      setStatus('B-roll disabled. Save review edits to re-render.');
    }
    function renderMediaReview(editablePlan, candidates) {
      const visuals = editablePlan.animations.filter(item => item.type === 'media_visual');
      const audits = new Map((editablePlan.media_assets || []).map(asset => [asset.asset_id, asset]));
      mediaList.replaceChildren();
      visuals.forEach(animation => {
        const audit = audits.get(animation.parameters.asset_id);
        const card = document.createElement('article'); card.className = 'media-card';
        const title = document.createElement('strong'); title.textContent = `${animation.parameters.title} · ${animation.start_ms}-${animation.end_ms} ms`;
        const source = document.createElement('small'); source.textContent = audit ? `${audit.provider} · ${audit.search_query} · ${audit.source_url || 'generated original'} · ${audit.license}` : (animation.parameters.enabled ? 'Pending selection/render' : 'Disabled');
        const disable = document.createElement('button'); disable.type = 'button'; disable.textContent = animation.parameters.enabled ? 'Disable' : 'Enable';
        disable.addEventListener('click', () => { if (animation.parameters.enabled) disableMedia(animation.parameters.asset_id); else { const next = currentPlan(); next.animations.find(item => item.id === animation.id).parameters.enabled = true; writePlan(next); renderMediaReview(next, []); } });
        card.append(title, source, disable); mediaList.append(card);
      });
      candidateList.replaceChildren();
      candidates.forEach(candidate => {
        const card = document.createElement('article'); card.className = 'media-card';
        const title = document.createElement('strong'); title.textContent = `${candidate.title} (${candidate.asset_kind})`;
        const source = document.createElement('small'); source.textContent = `${candidate.provider} · ${candidate.author_or_provider} · ${candidate.license} · ${candidate.source_url}`;
        const target = document.createElement('select'); visuals.filter(item => item.parameters.enabled).forEach(item => { const option = document.createElement('option'); option.value = item.parameters.asset_id; option.textContent = `Use for: ${item.parameters.title}`; target.append(option); });
        const use = document.createElement('button'); use.type = 'button'; use.textContent = 'Use this'; use.addEventListener('click', () => useCandidate({...candidate, targetAssetId: target.value}));
        card.append(title, source, target, use); candidateList.append(card);
      });
    }
    async function loadMediaReview(id) {
      const response = await fetch(`/api/videos/${id}/media`); if (!response.ok) return;
      const payload = await response.json(); renderMediaReview(currentPlan(), payload.candidates || []);
    }
    function showResult(id) {
      preview.src = `/api/videos/${id}/download?preview=${Date.now()}`;
      download.href = `/api/videos/${id}/download`;
      result.classList.remove('hidden');
    }
    async function loadTask(id) {
      const response = await fetch(`/api/videos/${id}`);
      if (!response.ok) throw new Error('Could not load the task.');
      const task = await response.json();
      if (task.status === 'completed') {
        transcript.value = pretty(task.transcript);
        plan.value = pretty(task.plan);
        showResult(id);
        loadMediaReview(id);
        setStatus(`Completed. ${task.metadata.duration_seconds.toFixed(2)} seconds, ${task.metadata.width} x ${task.metadata.height}.`);
      }
      return task;
    }
    function watchTask(id) {
      const events = new EventSource(`/api/videos/${id}/events?after_event_id=${lastEventId}`);
      const readEvent = event => { const detail = JSON.parse(event.data); lastEventId = Math.max(lastEventId, detail.id); return detail; };
      ['created', 'processing', 'rendering', 'review_rendering', 'cancel_requested'].forEach((name) => events.addEventListener(name, event => setStatus(readEvent(event).message)));
      events.addEventListener('completed', async event => {
        const detail = readEvent(event);
        events.close();
        showResult(id);
        setStatus(detail.message);
        try { await loadTask(id); }
        catch (error) { setStatus(`${detail.message}\nDownload is ready; transcript and plan could not be loaded: ${error.message}`); }
      });
      ['failed', 'cancelled'].forEach((name) => events.addEventListener(name, event => { const detail = readEvent(event); events.close(); setStatus(detail.message); }));
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!input.files[0]) return;
      result.classList.add('hidden'); setStatus('正在上传视频…');
      const data = new FormData();
      data.append('file', input.files[0]);
      data.append('processing_profile', processingProfile.value);
      data.append('media_provider', uploadMediaProvider.value);
      try {
        const response = await fetch('/api/videos', { method: 'POST', body: data });
        const body = await response.json(); if (!response.ok) throw new Error(body.detail || 'Upload failed.');
        taskId = body.task_id; watchTask(taskId);
      } catch (error) { setStatus(`Failed: ${error.message}`); }
    });
    saveReview.addEventListener('click', async () => {
      if (!taskId) return;
      try {
        const body = { transcript: JSON.parse(transcript.value), plan: JSON.parse(plan.value) };
        saveReview.disabled = true; setStatus('正在校验审核修改并重新渲染…');
        const response = await fetch(`/api/videos/${taskId}/review`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const payload = await response.json(); if (!response.ok) throw new Error(payload.detail || 'Review update failed.');
        watchTask(taskId);
      } catch (error) { setStatus(`Review update failed: ${error.message}`); }
      finally { saveReview.disabled = false; }
    });
    searchMedia.addEventListener('click', async () => {
      if (!taskId || !mediaQuery.value.trim()) return;
      try {
        searchMedia.disabled = true; setStatus('正在搜索外部 B-roll 候选…');
        const response = await fetch(`/api/videos/${taskId}/media/search`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query: mediaQuery.value.trim(), asset_kind: mediaKind.value})});
        const payload = await response.json(); if (!response.ok) throw new Error(payload.detail || 'Search failed.');
        renderMediaReview(currentPlan(), payload.candidates); setStatus(`Found ${payload.candidates.length} candidates. Choose one, then save review edits.`);
      } catch (error) { setStatus(`Media search failed: ${error.message}`); } finally { searchMedia.disabled = false; }
    });
    manualMediaUrl.addEventListener('change', async () => {
      if (!taskId || !manualMediaUrl.value.trim()) return;
      try {
        const query = mediaQuery.value.trim() || 'manual visual';
        const response = await fetch(`/api/videos/${taskId}/media/candidates`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query, source_url: manualMediaUrl.value.trim(), title: query, asset_kind: mediaKind.value, mime_type: mediaKind.value === 'external_video' ? 'video/mp4' : 'image/jpeg'})});
        const payload = await response.json(); if (!response.ok) throw new Error(payload.detail || 'Could not add manual candidate.');
        renderMediaReview(currentPlan(), [payload.candidate]); manualMediaUrl.value = '';
      } catch (error) { setStatus(`Manual candidate failed: ${error.message}`); }
    });
  </script>
</body>
</html>
